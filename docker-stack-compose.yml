services:
  reciklomat_bot:
    image: "${CI_REGISTRY_IMAGE}/${CI_COMMIT_BRANCH}/reciklomat_bot:latest"
    build:
      context: .
    working_dir: "/usr/src/app/bot"
    command: python3 -m bot
    env_file:
      - "${MAIN_ENVIRONMENT}"
    ports:
      - "8092:80"
    deploy:
      restart_policy:
        condition: any
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      - reciklomat_mysql
    networks:
      - reciklomat_net

  reciklomat_api:
    image: "${CI_REGISTRY_IMAGE}/${CI_COMMIT_BRANCH}/reciklomat_api:latest"
    build:
      context: ./infrastructure/api
    working_dir: "/usr/src/app/api"
    command: [ "gunicorn", "-w", "4", "-b", "0.0.0.0:8000", "infrastructure.api.app:app" ]
    env_file:
      - "${MAIN_ENVIRONMENT}"
    ports:
      - "8093:8000"
    deploy:
      restart_policy:
        condition: any
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      - reciklomat_mysql
    networks:
      - reciklomat_net

  reciklomat_mysql:
    image: "mysql:9.2.0"
    env_file:
      - "${MAIN_ENVIRONMENT}"
    ports:
      - "3311:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_conf.cnf:/etc/mysql/conf.d/db_conf.cnf
      - ./db_init.sql:/docker-entrypoint-initdb.d/db_init.sql
    deploy:
      restart_policy:
        condition: any
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - reciklomat_net

volumes:
  mysql_data:

networks:
  reciklomat_net:
    driver: overlay
